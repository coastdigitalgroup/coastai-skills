<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dropdown and Menu System Specification Template</title>
  <style>
    :root {
      --surface-bg: #ffffff;
      --surface-overlay: #ffffff;
      --surface-hover: #f3f4f6;
      --surface-active: #e5e7eb;
      --surface-danger-hover: #fef2f2;

      --text-primary: #111827;
      --text-secondary: #4b5563;
      --text-muted: #9ca3af;
      --text-danger: #dc2626;

      --border-subtle: #e5e7eb;
      --border-focus: #2563eb;

      --shadow-menu: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
      --radius-menu: 8px;
      --radius-item: 6px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface-bg: #111827;
        --surface-overlay: #1f2937;
        --surface-hover: #374151;
        --surface-active: #4b5563;
        --surface-danger-hover: #450a0a;

        --text-primary: #f9fafb;
        --text-secondary: #d1d5db;
        --text-muted: #6b7280;
        --text-danger: #f87171;

        --border-subtle: #374151;
        --border-focus: #60a5fa;

        --shadow-menu: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -4px rgba(0, 0, 0, 0.5);
      }
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--surface-bg);
      color: var(--text-primary);
      padding: 2rem;
      margin: 0;
    }

    /* Trigger Container */
    .menu-trigger-wrapper {
      position: relative;
      display: inline-block;
    }

    .btn-trigger {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      background-color: var(--surface-overlay);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      cursor: pointer;
      min-height: 40px;
    }

    .btn-trigger:focus-visible {
      outline: 2px solid var(--border-focus);
      outline-offset: 2px;
    }

    /* Menu Container */
    .dropdown-menu {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      z-index: 100;
      min-width: 220px;
      max-width: 320px;
      max-height: 320px;
      overflow-y: auto;
      overscroll-behavior: contain;
      background-color: var(--surface-overlay);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-menu);
      box-shadow: var(--shadow-menu);
      padding: 6px;
      display: none; /* Toggled via JS / state */
    }

    .dropdown-menu[data-open="true"] {
      display: block;
    }

    /* Header & Divider */
    .menu-group-label {
      padding: 6px 10px 4px 10px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .menu-divider {
      height: 1px;
      background-color: var(--border-subtle);
      margin: 6px -6px;
    }

    /* Menu Item */
    .menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 8px 10px;
      font-size: 14px;
      color: var(--text-primary);
      background: none;
      border: none;
      border-radius: var(--radius-item);
      cursor: pointer;
      text-align: left;
      box-sizing: border-box;
      min-height: 36px;
    }

    .menu-item-content {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .menu-item-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      fill: currentColor;
    }

    .menu-item-shortcut {
      font-size: 12px;
      color: var(--text-muted);
      font-family: monospace;
    }

    /* Item States */
    .menu-item:hover,
    .menu-item:focus,
    .menu-item[data-highlighted="true"] {
      background-color: var(--surface-hover);
      outline: none;
    }

    .menu-item:active {
      background-color: var(--surface-active);
    }

    .menu-item[aria-disabled="true"] {
      opacity: 0.5;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* Destructive Variant */
    .menu-item--danger {
      color: var(--text-danger);
    }

    .menu-item--danger:hover,
    .menu-item--danger:focus,
    .menu-item--danger[data-highlighted="true"] {
      background-color: var(--surface-danger-hover);
    }

    /* Mobile Responsive Adaptation */
    @media (max-width: 639px) {
      .dropdown-menu {
        min-width: 260px;
      }
      .menu-item {
        min-height: 44px; /* Touch target minimum */
        padding: 10px 12px;
      }
    }
  </style>
</head>
<body>

  <!-- Dropdown Specification Pattern -->
  <div class="menu-trigger-wrapper">
    <!-- Trigger Button -->
    <button
      id="action-menu-trigger"
      class="btn-trigger"
      aria-haspopup="menu"
      aria-expanded="false"
      aria-controls="action-menu-panel"
    >
      <span>Actions</span>
      <svg class="menu-item-icon" viewBox="0 0 20 20" aria-hidden="true">
        <path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/>
      </svg>
    </button>

    <!-- Floating Dropdown Panel -->
    <div
      id="action-menu-panel"
      class="dropdown-menu"
      role="menu"
      aria-labelledby="action-menu-trigger"
      data-open="false"
    >
      <div class="menu-group-label" id="group-manage-label">Management</div>

      <button role="menuitem" class="menu-item" tabindex="-1">
        <span class="menu-item-content">
          <svg class="menu-item-icon" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/>
          </svg>
          <span>Edit Item</span>
        </span>
        <span class="menu-item-shortcut">⌘E</span>
      </button>

      <button role="menuitem" class="menu-item" tabindex="-1">
        <span class="menu-item-content">
          <svg class="menu-item-icon" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M7 9a2 2 0 012-2h6a2 2 0 012 2v6a2 2 0 01-2 2H9a2 2 0 01-2-2V9z"/>
            <path d="M5 3a2 2 0 00-2 2v6a2 2 0 002 2V5h8a2 2 0 00-2-2H5z"/>
          </svg>
          <span>Duplicate</span>
        </span>
        <span class="menu-item-shortcut">⌘D</span>
      </button>

      <button role="menuitem" class="menu-item" aria-disabled="true" tabindex="-1">
        <span class="menu-item-content">
          <svg class="menu-item-icon" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M15 8a3 3 0 10-2.977-2.63l-4.94 2.47a3 3 0 100 4.319l4.94 2.47a3 3 0 10.895-1.789l-4.94-2.47a3.027 3.027 0 000-.74l4.94-2.47C13.456 7.68 14.19 8 15 8z"/>
          </svg>
          <span>Share (Disabled)</span>
        </span>
      </button>

      <div class="menu-divider" role="separator"></div>

      <div class="menu-group-label" id="group-danger-label">Danger Zone</div>

      <button role="menuitem" class="menu-item menu-item--danger" tabindex="-1">
        <span class="menu-item-content">
          <svg class="menu-item-icon" viewBox="0 0 20 20" aria-hidden="true">
            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/>
          </svg>
          <span>Delete Workspace</span>
        </span>
        <span class="menu-item-shortcut">⌦</span>
      </button>
    </div>
  </div>

</body>
</html>
