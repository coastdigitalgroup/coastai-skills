<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stepper and Wizard Design System Template</title>
  <style>
    :root {
      --color-primary: #2563eb;
      --color-primary-hover: #1d4ed8;
      --color-success: #16a34a;
      --color-error: #dc2626;
      --color-surface: #ffffff;
      --color-bg: #f8fafc;
      --color-text-main: #0f172a;
      --color-text-muted: #64748b;
      --color-border: #cbd5e1;
      --color-border-track: #e2e8f0;
      --focus-ring: 0 0 0 3px rgba(37, 99, 235, 0.35);
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--color-bg);
      color: var(--color-text-main);
      padding: 24px;
      line-height: 1.5;
    }

    .wizard-container {
      max-width: 960px;
      margin: 0 auto;
      background: var(--color-surface);
      border-radius: 12px;
      border: 1px solid var(--color-border);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      overflow: hidden;
    }

    /* ==========================================================================
       1. STEPPER NAVIGATION (HORIZONTAL DESKTOP)
       ========================================================================== */
    .stepper-nav {
      padding: 24px 32px;
      border-bottom: 1px solid var(--color-border-track);
      background: #fafafa;
    }

    .stepper-list {
      display: flex;
      align-items: center;
      justify-content: space-between;
      list-style: none;
      position: relative;
    }

    .stepper-item {
      display: flex;
      align-items: center;
      flex: 1;
      position: relative;
    }

    /* Track Connector Line */
    .stepper-item:not(:last-child)::after {
      content: "";
      height: 2px;
      flex: 1;
      background-color: var(--color-border-track);
      margin: 0 16px;
      transition: background-color 200ms ease;
    }

    .stepper-item--completed:not(:last-child)::after {
      background-color: var(--color-success);
    }

    .stepper-link {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--color-text-muted);
      font-weight: 500;
      min-height: 44px; /* WCAG 2.5.8 Touch Target */
      border-radius: 6px;
      padding: 4px 8px;
    }

    .stepper-link:focus-visible {
      outline: none;
      box-shadow: var(--focus-ring);
    }

    /* Step Badge Circle */
    .stepper-badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid var(--color-border);
      background-color: var(--color-surface);
      color: var(--color-text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      flex-shrink: 0;
      transition: all 200ms ease;
    }

    /* Active State */
    .stepper-item--active .stepper-badge {
      border-color: var(--color-primary);
      background-color: var(--color-primary);
      color: #ffffff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
    }

    .stepper-item--active .stepper-title {
      color: var(--color-primary);
      font-weight: 700;
    }

    /* Completed State */
    .stepper-item--completed .stepper-badge {
      border-color: var(--color-success);
      background-color: var(--color-success);
      color: #ffffff;
    }

    .stepper-item--completed .stepper-title {
      color: var(--color-text-main);
    }

    /* Error State */
    .stepper-item--error .stepper-badge {
      border-color: var(--color-error);
      background-color: #fef2f2;
      color: var(--color-error);
    }

    .stepper-title {
      font-size: 14px;
      white-space: nowrap;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* ==========================================================================
       2. WIZARD STEP MAIN CONTENT
       ========================================================================== */
    .wizard-content {
      padding: 32px;
    }

    .step-heading {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .step-description {
      color: var(--color-text-muted);
      margin-bottom: 24px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      font-size: 15px;
    }

    .form-input:focus-visible {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: var(--focus-ring);
    }

    /* ==========================================================================
       3. WIZARD ACTION DOCK (FOOTER)
       ========================================================================== */
    .wizard-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid var(--color-border-track);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      border: 1px solid transparent;
      min-height: 44px;
      transition: all 150ms ease;
    }

    .btn-primary {
      background-color: var(--color-primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: var(--color-primary-hover);
    }

    .btn-secondary {
      background-color: transparent;
      border-color: var(--color-border);
      color: var(--color-text-main);
    }

    .btn-secondary:hover {
      background-color: #f1f5f9;
    }

    /* ==========================================================================
       4. MOBILE ADAPTABILITY (< 768px)
       ========================================================================== */
    @media (max-width: 767px) {
      .stepper-nav {
        padding: 16px;
      }

      .stepper-list {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .stepper-item {
        width: 100%;
      }

      .stepper-item:not(:last-child)::after {
        display: none; /* Hide horizontal connector on mobile */
      }

      .stepper-title {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

  <div class="wizard-container">
    <!-- Accessible Navigation Stepper Container -->
    <nav aria-label="Order Checkout Steps" class="stepper-nav">
      <ol class="stepper-list">
        <!-- Step 1: Completed -->
        <li class="stepper-item stepper-item--completed">
          <a href="#step-1" class="stepper-link">
            <span class="stepper-badge" aria-hidden="true">✓</span>
            <span class="sr-only">Step 1: Account Info, Completed</span>
            <span class="stepper-title">1. Account Info</span>
          </a>
        </li>

        <!-- Step 2: Active / Current -->
        <li class="stepper-item stepper-item--active" aria-current="step">
          <div class="stepper-link">
            <span class="stepper-badge">2</span>
            <span class="stepper-title">
              <span class="sr-only">Step 2: </span>2. Shipping Address
            </span>
          </div>
        </li>

        <!-- Step 3: Upcoming -->
        <li class="stepper-item stepper-item--upcoming">
          <div class="stepper-link">
            <span class="stepper-badge">3</span>
            <span class="sr-only">Step 3: Upcoming</span>
            <span class="stepper-title">3. Payment</span>
          </div>
        </li>

        <!-- Step 4: Upcoming -->
        <li class="stepper-item stepper-item--upcoming">
          <div class="stepper-link">
            <span class="stepper-badge">4</span>
            <span class="sr-only">Step 4: Upcoming</span>
            <span class="stepper-title">4. Review Order</span>
          </div>
        </li>
      </ol>
    </nav>

    <!-- Main Step Content (Target for Keyboard Focus Shift) -->
    <main class="wizard-content" id="wizard-main">
      <h2 class="step-heading" id="step-title" tabindex="-1">Step 2: Shipping Address</h2>
      <p class="step-description">Enter your primary physical shipping destination.</p>

      <form id="wizard-step-form" onsubmit="event.preventDefault();">
        <div class="form-group">
          <label for="street-address" class="form-label">Street Address *</label>
          <input type="text" id="street-address" class="form-input" required placeholder="123 Main Street">
        </div>

        <div class="form-group">
          <label for="city" class="form-label">City *</label>
          <input type="text" id="city" class="form-input" required placeholder="Austin">
        </div>

        <!-- Wizard Action Dock -->
        <div class="wizard-actions">
          <button type="button" class="btn btn-secondary" onclick="alert('Navigating to Step 1: Account Info');">
            ← Back
          </button>
          <button type="submit" class="btn btn-primary" onclick="alert('Form Validated! Navigating to Step 3: Payment');">
            Continue to Payment →
          </button>
        </div>
      </form>
    </main>
  </div>

</body>
</html>
