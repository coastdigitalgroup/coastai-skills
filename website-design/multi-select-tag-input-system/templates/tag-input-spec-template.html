<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Select Tag Input Specification Template</title>
  <style>
    :root {
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --color-bg-surface: #ffffff;
      --color-text-primary: #111827;
      --color-text-secondary: #4b5563;
      --color-border-default: #d1d5db;
      --color-border-focus: #2563eb;
      --color-ring-focus: rgba(37, 99, 235, 0.25);

      --color-chip-bg: #f3f4f6;
      --color-chip-border: #e5e7eb;
      --color-chip-text: #1f2937;
      --color-chip-hover: #e5e7eb;
      --color-chip-focused: #dbeafe;
      --color-chip-focused-text: #1e40af;

      --color-dropdown-bg: #ffffff;
      --color-dropdown-border: #e5e7eb;
      --color-option-hover: #f3f4f6;
      --color-option-selected: #eff6ff;
      --color-option-selected-text: #1d4ed8;

      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-pill: 9999px;

      --spacing-xs: 4px;
      --spacing-sm: 6px;
      --spacing-md: 8px;
      --spacing-lg: 12px;
    }

    body {
      font-family: var(--font-family);
      background-color: #f9fafb;
      color: var(--color-text-primary);
      padding: 2rem;
      margin: 0;
    }

    .tag-input-group {
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }

    .field-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--color-text-primary);
      margin-bottom: var(--spacing-xs);
    }

    .field-description {
      font-size: 0.8125rem;
      color: var(--color-text-secondary);
      margin-bottom: var(--spacing-sm);
    }

    /* Container wrapping chips and input */
    .tag-input-container {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--spacing-sm);
      padding: var(--spacing-sm) var(--spacing-md);
      background-color: var(--color-bg-surface);
      border: 1px solid var(--color-border-default);
      border-radius: var(--radius-md);
      min-height: 44px;
      box-sizing: border-box;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .tag-input-container:focus-within {
      border-color: var(--color-border-focus);
      box-shadow: 0 0 0 3px var(--color-ring-focus);
    }

    /* Individual Tag Chip */
    .tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 28px;
      padding: 2px var(--spacing-xs) 2px var(--spacing-md);
      background-color: var(--color-chip-bg);
      border: 1px solid var(--color-chip-border);
      border-radius: var(--radius-pill);
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--color-chip-text);
      user-select: none;
      max-width: 200px;
    }

    .tag-chip--focused {
      background-color: var(--color-chip-focused);
      color: var(--color-chip-focused-text);
      border-color: #93c5fd;
    }

    .tag-chip__label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tag-chip__remove-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      min-width: 20px;
      min-height: 20px;
      padding: 0;
      margin: 0;
      background: transparent;
      border: none;
      border-radius: 50%;
      color: var(--color-text-secondary);
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      transition: background-color 0.1s ease, color 0.1s ease;
    }

    .tag-chip__remove-btn:hover,
    .tag-chip__remove-btn:focus {
      background-color: rgba(0, 0, 0, 0.1);
      color: var(--color-text-primary);
      outline: none;
    }

    /* Embedded Text Input */
    .tag-input-field {
      flex: 1 1 80px;
      min-width: 80px;
      border: none;
      outline: none;
      background: transparent;
      font-family: inherit;
      font-size: 0.875rem;
      color: var(--color-text-primary);
      padding: 2px 0;
      margin: 0;
    }

    .tag-input-field::placeholder {
      color: #9ca3af;
    }

    /* Autocomplete Dropdown Listbox */
    .tag-dropdown-listbox {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background-color: var(--color-dropdown-bg);
      border: 1px solid var(--color-dropdown-border);
      border-radius: var(--radius-md);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      max-height: 220px;
      overflow-y: auto;
      margin: 0;
      padding: var(--spacing-xs) 0;
      list-style: none;
      z-index: 50;
    }

    .tag-dropdown-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--spacing-sm) var(--spacing-lg);
      font-size: 0.875rem;
      color: var(--color-text-primary);
      cursor: pointer;
      transition: background-color 0.1s ease;
    }

    .tag-dropdown-option--highlighted {
      background-color: var(--color-option-hover);
    }

    .tag-dropdown-option--selected {
      background-color: var(--color-option-selected);
      color: var(--color-option-selected-text);
      font-weight: 500;
    }

    /* Visually Hidden Live Region */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>

  <div class="tag-input-group">
    <label id="tag-label" class="field-label" for="tag-combobox-input">
      Technologies & Frameworks
    </label>
    <div id="tag-desc" class="field-description">
      Type to search technologies or select from dropdown list.
    </div>

    <!-- Combobox Container -->
    <div class="tag-input-container" onclick="document.getElementById('tag-combobox-input').focus()">

      <!-- Selected Chip 1 -->
      <span class="tag-chip" id="chip-1">
        <span class="tag-chip__label">TypeScript</span>
        <button type="button" class="tag-chip__remove-btn" aria-label="Remove tag TypeScript" onclick="event.stopPropagation();">
          &times;
        </button>
      </span>

      <!-- Selected Chip 2 -->
      <span class="tag-chip" id="chip-2">
        <span class="tag-chip__label">Accessibility (WCAG)</span>
        <button type="button" class="tag-chip__remove-btn" aria-label="Remove tag Accessibility (WCAG)" onclick="event.stopPropagation();">
          &times;
        </button>
      </span>

      <!-- Embedded Input Field -->
      <input
        type="text"
        id="tag-combobox-input"
        class="tag-input-field"
        role="combobox"
        aria-expanded="true"
        aria-haspopup="listbox"
        aria-controls="tag-listbox-options"
        aria-labelledby="tag-label"
        aria-describedby="tag-desc"
        aria-autocomplete="list"
        placeholder="Add technology..."
        autocomplete="off"
      />
    </div>

    <!-- Dropdown Listbox -->
    <ul
      id="tag-listbox-options"
      class="tag-dropdown-listbox"
      role="listbox"
      aria-multiselectable="true"
      aria-labelledby="tag-label"
    >
      <li role="option" aria-selected="true" class="tag-dropdown-option tag-dropdown-option--selected">
        <span>TypeScript</span>
        <span aria-hidden="true">&#10003;</span>
      </li>
      <li role="option" aria-selected="true" class="tag-dropdown-option tag-dropdown-option--selected">
        <span>Accessibility (WCAG)</span>
        <span aria-hidden="true">&#10003;</span>
      </li>
      <li role="option" aria-selected="false" class="tag-dropdown-option tag-dropdown-option--highlighted">
        <span>React.js</span>
      </li>
      <li role="option" aria-selected="false" class="tag-dropdown-option">
        <span>Tailwind CSS</span>
      </li>
      <li role="option" aria-selected="false" class="tag-dropdown-option">
        <span>GraphQL</span>
      </li>
    </ul>

    <!-- Live Region for Screen Reader Announcements -->
    <div class="sr-only" aria-live="polite" id="tag-live-announce">
      2 tags currently selected: TypeScript, Accessibility (WCAG).
    </div>
  </div>

</body>
</html>
